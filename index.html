    <script>
        // ... existing code ...
        // 建立擂台與加入擂台邏輯
        async function createArenaSubmit() {
            const arenaName = document.getElementById('arena-name-input').value.trim() || '數學計算爭霸擂台';
            const topic = document.getElementById('arena-topic-select').value;
            const mode = document.getElementById('arena-mode-select').value;
            const modeName = document.getElementById('arena-mode-select').selectedOptions[0]?.text.split('(')[0].trim() || '預設單元';
            
            let targetScore = 5;
            const targetRadio = document.querySelector('input[name="arenaTarget"]:checked').value;
            if (targetRadio === '5') targetScore = 5;
            else if (targetRadio === '10') targetScore = 10;
            else {
                const customVal = parseInt(document.getElementById('arena-custom-target').value, 10);
                targetScore = Math.min(Math.max(isNaN(customVal) ? 5 : customVal, 1), 20);
            }

            // 擂台代碼縮減為 3 碼數字 (100 ~ 999)
            const code = Math.floor(100 + Math.random() * 900).toString();
            currentArenaId = code;
            isTeacherHost = true;

            arenaState = {
                id: code,
                title: arenaName,
                topic: topic,
                mode: mode,
                modeName: modeName,
                targetScore: targetScore,
                status: 'waiting',
                createdAt: new Date().toISOString(),
                players: {},
                winner: null,
                round: 1
            };

            compQuestionPool = buildQuestionsByMode(topic, mode);

            initHostPeer(code);
            saveArenaState(arenaState);
            listenToArena(currentArenaId);

            document.getElementById('lobby-arena-title').innerText = arenaName;
            document.getElementById('lobby-arena-unit').innerText = `${worksheetMeta[topic].title} · ${modeName}`;
            document.getElementById('lobby-arena-target').innerText = targetScore;
            document.getElementById('lobby-arena-code').innerText = code;

            const joinUrl = window.location.href.split('?')[0] + '?arena=' + code;
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(joinUrl)}`;
            document.getElementById('lobby-qrcode-img').src = qrApiUrl;

            hideAllCompViews();
            document.getElementById('comp-lobby-view').classList.remove('hidden');
        }
        // ... existing code ...
        async function joinArenaSubmit() {
            const codeInput = document.getElementById('join-code-input').value.trim();
            const nameInput = document.getElementById('join-name-input').value.trim() || '無名選手';

            // 驗證 3 碼代碼
            if (!codeInput || codeInput.length !== 3) {
                showToast("請輸入正確的 3 位數擂台代碼！");
                return;
            }

            currentArenaId = codeInput;
            myPlayerName = nameInput;
            myCurrentScore = 0;
            isTeacherHost = false;

            showToast("正在連線進入擂台...", false);

            const playerData = {
                id: myPlayerId,
                name: myPlayerName,
                score: 0,
                joinedAt: new Date().toISOString()
            };

            if (window._fb?.authReadyPromise) {
                await window._fb.authReadyPromise;
            }

            if (window.Peer) {
                try {
                    if (clientPeer) { try { clientPeer.destroy(); } catch(e){} clientPeer = null; }
                    clientPeer = new Peer();
                    clientPeer.on('open', () => {
                        clientConn = clientPeer.connect(`matharena-${currentArenaId}`, { reliable: true });
                        clientConn.on('open', () => {
                            clientConn.send({ type: 'JOIN_ARENA', player: playerData });
                        });
                        clientConn.on('data', (data) => {
                            if (data.type === 'ARENA_STATE_SYNC' && data.state) {
                                onArenaDataUpdated(data.state);
                            }
                        });
                    });
                } catch(e) {
                    console.warn("Peer Client 連線異常:", e);
                }
            }

            if (broadcastChannel) {
                broadcastChannel.postMessage({ type: 'REQUEST_ROOM_SYNC', arenaId: currentArenaId, player: playerData });
            }

            let attempts = 0;
            const maxAttempts = 6;
            const checkInterval = setInterval(async () => {
                attempts++;
                let arenaData = await fetchArenaData(currentArenaId);
                if (arenaData || (arenaState && arenaState.id === currentArenaId)) {
                    clearInterval(checkInterval);
                    if (!arenaState && arenaData) arenaState = arenaData;

                    if (!arenaState.players) arenaState.players = {};
                    arenaState.players[myPlayerId] = playerData;
                    await updateArenaPlayer(currentArenaId, myPlayerId, playerData);
                    listenToArena(currentArenaId);

                    document.getElementById('student-waiting-name').innerText = myPlayerName;
                    document.getElementById('student-waiting-code').innerText = currentArenaId;
                    document.getElementById('student-waiting-target').innerText = arenaState.targetScore + ' 題獲勝';

                    hideAllCompViews();
                    document.getElementById('comp-student-waiting-view').classList.remove('hidden');
                    showToast("已成功加入擂台！", true);
                    return;
                }

                if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    showToast("找不到該擂台或擂台已結束，請確認代碼是否正確！");
                }
            }, 300);
        }
        // ... existing code ...
        function onArenaDataUpdated(data) {
            const previousStatus = arenaState?.status;
            const previousRound = arenaState?.round || 1;
            arenaState = data;

            if (isTeacherHost && arenaState.status === 'waiting') {
                renderLobbyPlayers(arenaState.players || {});
            }

            if (arenaState.status === 'playing') {
                if (isTeacherHost) {
                    hideAllCompViews();
                    document.getElementById('comp-teacher-monitor-view').classList.remove('hidden');
                    document.getElementById('monitor-code').innerText = arenaState.id;
                    document.getElementById('monitor-target').innerText = arenaState.targetScore;
                    renderMonitorBoard(arenaState.players || {});
                } else {
                    hideAllCompViews();
                    document.getElementById('comp-student-play-view').classList.remove('hidden');
                    document.getElementById('student-play-name').innerText = myPlayerName;
                    document.getElementById('student-target-score').innerText = arenaState.targetScore;
                    
                    // 當為新一輪開始時，重置學生本地題目與分數
                    if (previousStatus === 'ended' || (arenaState.round && arenaState.round > previousRound)) {
                        myCurrentScore = (arenaState.players && arenaState.players[myPlayerId]) ? (arenaState.players[myPlayerId].score || 0) : 0;
                        document.getElementById('student-my-score').innerText = myCurrentScore;
                        document.getElementById('student-progress-bar').style.width = '0%';
                        compCurrentQ = null;
                        document.getElementById('comp-feedback-text').innerText = '答對 +1 分，答錯扣 1 分（最低 0 分）';
                    }

                    if (!compQuestionPool || compQuestionPool.length === 0 || arenaState.round > previousRound) {
                        compQuestionPool = buildQuestionsByMode(arenaState.topic, arenaState.mode);
                    }
                    if (!compCurrentQ) {
                        nextCompQuestion();
                    }
                }
            }

            if (isTeacherHost && arenaState.status === 'playing') {
                renderMonitorBoard(arenaState.players || {});
            }

            if (arenaState.status === 'ended') {
                renderPodiumAndResults(arenaState);
            }
        }
        // ... existing code ...
        function renderPodiumAndResults(arenaData) {
            hideAllCompViews();
            document.getElementById('comp-podium-view').classList.remove('hidden');

            // 老師端顯示原擂台續賽操作按鈕
            const hostControls = document.getElementById('host-rematch-controls');
            if (isTeacherHost) {
                hostControls.classList.remove('hidden');
            } else {
                hostControls.classList.add('hidden');
            }

            const players = Object.values(arenaData.players || {}).sort((a, b) => b.score - a.score);
            const first = arenaData.winner || players[0] || { name: '無', score: 0 };
            const second = players[1] || { name: '從缺', score: 0 };
            const third = players[2] || { name: '從缺', score: 0 };

            document.getElementById('podium-first-huge-name').innerText = first.name;
            document.getElementById('podium-first-score-tag').innerText = `以 ${first.score} 分率先達標奪得擂台盟主！`;

            document.getElementById('podium-p1-name').innerText = first.name;
            document.getElementById('podium-p1-score').innerText = `${first.score} 分`;

            document.getElementById('podium-p2-name').innerText = second.name;
            document.getElementById('podium-p2-score').innerText = second.name === '從缺' ? '-' : `${second.score} 分`;

            document.getElementById('podium-p3-name').innerText = third.name;
            document.getElementById('podium-p3-score').innerText = third.name === '從缺' ? '-' : `${third.score} 分`;

            const tbody = document.getElementById('podium-all-table-body');
            tbody.innerHTML = '';
            players.forEach((p, idx) => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50";

                let medal = `${idx + 1}`;
                let titleHonor = '努力奮戰';
                if (idx === 0) { medal = '🥇 1'; titleHonor = '🏆 擂台盟主'; }
                else if (idx === 1) { medal = '🥈 2'; titleHonor = '亞軍神捕'; }
                else if (idx === 2) { medal = '🥉 3'; titleHonor = '季軍高手'; }

                tr.innerHTML = `
                    <td class="p-2 text-center font-black ${idx === 0 ? 'text-amber-600 font-extrabold text-sm' : 'text-gray-600'}">${medal}</td>
                    <td class="p-2 font-bold text-gray-800">${p.name}</td>
                    <td class="p-2 text-center font-extrabold text-indigo-700">${p.score}</td>
                    <td class="p-2 text-right font-black ${idx < 3 ? 'text-amber-600' : 'text-gray-400'}">${titleHonor}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ================== 原擂台續賽邏輯 (老師控制) ==================
        function openRematchModal() {
            if (!arenaState) return;
            document.getElementById('rematch-modal-code').innerText = arenaState.id;
            document.getElementById('rematch-topic-select').value = arenaState.topic || 'multiply';
            updateRematchModeOptions();
            document.getElementById('rematch-mode-select').value = arenaState.mode || 'mul-9x9-standard';
            document.getElementById('rematch-target-select').value = arenaState.targetScore || '5';
            
            const modal = document.getElementById('rematch-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeRematchModal() {
            const modal = document.getElementById('rematch-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function updateRematchModeOptions() {
            const topic = document.getElementById('rematch-topic-select').value;
            const select = document.getElementById('rematch-mode-select');
            select.innerHTML = '';
            worksheetMeta[topic].modes.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.innerText = m.name;
                select.appendChild(opt);
            });
        }

        function confirmRestartArenaMatch() {
            if (!arenaState || !isTeacherHost) return;

            const newTopic = document.getElementById('rematch-topic-select').value;
            const newMode = document.getElementById('rematch-mode-select').value;
            const newModeName = document.getElementById('rematch-mode-select').selectedOptions[0]?.text.split('(')[0].trim() || '新單元';
            const newTarget = parseInt(document.getElementById('rematch-target-select').value, 10) || 5;

            // 重置所有參賽選手成績為 0
            if (arenaState.players) {
                Object.keys(arenaState.players).forEach(pId => {
                    arenaState.players[pId].score = 0;
                });
            }

            arenaState.topic = newTopic;
            arenaState.mode = newMode;
            arenaState.modeName = newModeName;
            arenaState.targetScore = newTarget;
            arenaState.status = 'playing';
            arenaState.winner = null;
            arenaState.round = (arenaState.round || 1) + 1;

            compQuestionPool = buildQuestionsByMode(newTopic, newMode);

            closeRematchModal();
            broadcastToAllStudents({ type: 'ARENA_STATE_SYNC', state: arenaState });
            onArenaDataUpdated(arenaState);
            showToast(`第 ${arenaState.round} 局開戰！全員分數已歸零！`, true);
        }
